  # ==================== REFERENCE DOMAIN ====================

  # Reference Service
  reference-service:
    build:
      context: ./services/reference-service
      dockerfile: Dockerfile
    container_name: dungeonland-reference-service
    environment:
      PORT: 3010
      REFERENCE_DB_HOST: reference-db
      REFERENCE_DB_PORT: 5432
      REFERENCE_DB_USER: postgres
      REFERENCE_DB_PASSWORD: postgres
      REFERENCE_DB_NAME: dungeonland_reference
